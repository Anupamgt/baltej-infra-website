<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Apply for a role at M/s Baltej Infra LLP" />
  <title>Apply | M/s Baltej Infra LLP Careers</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body data-theme="standard" class="page-apply">

  <header class="main-header scrolled careers-header apply-topbar" id="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand" aria-label="Baltej Infra LLP Home">
        <span class="brand-mark">BALTEJ</span>
        <span class="brand-sub">INFRA LLP</span>
      </a>
      <nav class="nav-links">
        <a href="careers.html">Careers</a>
        <a href="index.html#contact" class="btn-primary nav-cta">Contact</a>
      </nav>
      <a href="careers.html#openings" class="apply-mobile-back">Jobs</a>
    </div>
  </header>

  <main class="apply-page">
    <div class="container apply-shell">
      <a href="careers.html#openings" class="apply-back-link apply-back-desktop">← All jobs</a>

      <header class="apply-role-banner">
        <p class="apply-role-label">Applying for</p>
        <h1 id="apply-job-title">Role</h1>
        <p class="apply-job-meta" id="apply-job-meta">Baltej Infra LLP</p>
        <p class="apply-job-chips" id="apply-job-facts"></p>
      </header>

      <section class="apply-form-panel">
        <div id="apply-form-view">
          <form id="job-application-form" class="apply-form" novalidate>
            <div class="apply-field">
              <label for="apply-name">Full name</label>
              <input id="apply-name" name="name" type="text" autocomplete="name" required placeholder="Your full name" />
            </div>

            <div class="apply-row">
              <div class="apply-field">
                <label for="apply-email">Email</label>
                <input id="apply-email" name="email" type="email" autocomplete="email" required placeholder="you@email.com" inputmode="email" />
              </div>
              <div class="apply-field">
                <label for="apply-phone">Phone</label>
                <input id="apply-phone" name="phone" type="tel" autocomplete="tel" required placeholder="+91 …" inputmode="tel" />
              </div>
            </div>

            <div class="apply-field">
              <label for="apply-location">City <span class="optional">(optional)</span></label>
              <input id="apply-location" name="location" type="text" autocomplete="address-level2" placeholder="e.g. Panchkula" />
            </div>

            <div class="apply-field">
              <label for="apply-resume">Resume</label>
              <div class="resume-dropzone" id="resume-dropzone" tabindex="0" role="button" aria-describedby="resume-help">
                <input
                  type="file"
                  id="apply-resume"
                  name="resume"
                  accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                  hidden
                />
                <div class="resume-dropzone-idle" id="resume-idle">
                  <p class="resume-drop-title">Tap to upload resume</p>
                  <p id="resume-help" class="resume-help">PDF or Word · max 5 MB</p>
                </div>
                <div class="resume-dropzone-file" id="resume-file" hidden>
                  <div class="resume-file-icon" aria-hidden="true">PDF</div>
                  <div class="resume-file-meta">
                    <p class="resume-file-name" id="resume-file-name"></p>
                    <p class="resume-file-size" id="resume-file-size"></p>
                  </div>
                  <button type="button" class="resume-remove" id="resume-remove">Change</button>
                </div>
              </div>
              <p class="field-error" id="resume-error" hidden>Please upload a resume (PDF or Word, max 5 MB).</p>
            </div>

            <div class="apply-field">
              <label for="apply-cover">Message <span class="optional">(optional)</span></label>
              <textarea id="apply-cover" name="cover" rows="3" placeholder="Short note for the hiring team"></textarea>
            </div>

            <input type="hidden" id="apply-role" name="role" value="" />
            <input type="hidden" id="apply-linkedin" name="linkedin" value="" />

            <label class="apply-consent">
              <input type="checkbox" id="apply-consent" required />
              <span>I agree to be contacted about this role.</span>
            </label>

            <div class="apply-actions">
              <button type="submit" class="btn-primary apply-submit" id="apply-submit">Submit application</button>
            </div>
          </form>
        </div>

        <div id="apply-success" class="apply-success" hidden>
          <h2>Application submitted</h2>
          <p id="apply-success-copy"></p>
          <div class="apply-success-actions">
            <a href="careers.html#openings" class="btn-primary">View other roles</a>
            <a href="index.html" class="apply-text-link">Home</a>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
  <script src="apply.js"></script>
</body>
</html>
